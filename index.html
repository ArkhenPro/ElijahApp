<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Elijah App</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f0c20 0%, #15102a 50%, #060210 100%);
            --panel-bg: rgba(30, 25, 50, 0.65);
            --border-glow: rgba(108, 92, 231, 0.25);
            --primary: #8a7cff;
            --primary-glow: #6c5ce7;
            --accent: #00f2fe;
            --text-main: #ffffff;
            --text-muted: #b3aed2;
            --bubble-user: linear-gradient(135deg, #6c5ce7 0%, #8a7cff 100%);
            --bubble-bot: rgba(255, 255, 255, 0.07);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* App Container with full glassmorphism style */
        .app-window {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glow);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        @media (min-width: 485px) {
            .app-window {
                height: 850px;
                border-radius: 30px;
            }
        }

        /* --- HOMEPAGE VIEW --- */
        .page-view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease;
            z-index: 5;
        }

        #homepage {
            padding: 40px 30px;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            opacity: 1;
        }

        .hero-section {
            margin-top: 40px;
        }

        .app-logo {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--primary-glow) 100%);
            border-radius: 24px;
            margin: 0 auto 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: bold;
            box-shadow: 0 0 30px rgba(108, 92, 231, 0.5);
            animation: pulseGlow 3s infinite ease-in-out;
        }

        .hero-section h1 {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(120deg, #fff 30%, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .hero-section p {
            color: var(--text-muted);
            font-size: 1rem;
            max-width: 280px;
            margin: 0 auto;
        }

        .features-grid {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 30px 0;
        }

        .feature-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 14px 20px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            gap: 15px;
            text-align: left;
        }

        .feature-card span {
            font-size: 1.5rem;
        }

        .feature-card div h4 {
            font-size: 0.95rem;
            color: var(--text-main);
        }

        .feature-card div p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .launch-btn {
            width: 100%;
            background: linear-gradient(90deg, var(--primary-glow), #8257e5);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 20px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(108, 92, 231, 0.4);
            transition: all 0.3s ease;
        }

        .launch-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(108, 92, 231, 0.6);
        }

        /* --- CHAT VIEW --- */
        #chatpage {
            transform: translateX(100%);
            opacity: 0;
            pointer-events: none;
        }

        .app-window.chat-active #homepage {
            transform: translateX(-100%);
            opacity: 0;
            pointer-events: none;
        }

        .app-window.chat-active #chatpage {
            transform: translateX(0);
            opacity: 1;
            pointer-events: auto;
        }

        header {
            padding: 18px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(15, 12, 32, 0.4);
        }

        header .title-area h2 {
            font-size: 1.2rem;
            font-weight: 700;
        }

        header .title-area p {
            font-size: 0.75rem;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        header .title-area p::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 6px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent);
        }

        .help-trigger {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .help-trigger:hover {
            background: var(--primary-glow);
            box-shadow: 0 0 15px var(--primary-glow);
            border-color: transparent;
        }

        .chat-stream {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Modern Custom Scrollbar */
        .chat-stream::-webkit-scrollbar {
            width: 5px;
        }
        .chat-stream::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .bubble {
            max-width: 80%;
            padding: 14px 18px;
            border-radius: 20px;
            font-size: 0.95rem;
            line-height: 1.45;
            animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            word-wrap: break-word;
        }

        .user-bubble {
            background: var(--bubble-user);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            box-shadow: 0 8px 20px rgba(108, 92, 231, 0.25);
        }

        .bot-bubble {
            background: var(--bubble-bot);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .input-bar {
            padding: 20px 24px;
            background: rgba(15, 12, 32, 0.5);
            display: flex;
            gap: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .input-bar input {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px 22px;
            border-radius: 18px;
            color: white;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
        }

        .input-bar input:focus {
            border-color: var(--primary);
            background: rgba(0, 0, 0, 0.4);
            box-shadow: 0 0 15px rgba(108, 92, 231, 0.15);
        }

        .input-bar button {
            background: var(--primary-glow);
            color: white;
            border: none;
            padding: 0 22px;
            border-radius: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .input-bar button:hover {
            background: var(--primary);
            box-shadow: 0 5px 15px rgba(108, 92, 231, 0.4);
        }

        /* --- COMMAND MENU OVERLAY --- */
        .modal-mask {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 3, 15, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-mask.open {
            display: flex;
        }

        .modal-body {
            background: #181330;
            border: 1px solid rgba(255, 255, 255, 0.08);
            width: 100%;
